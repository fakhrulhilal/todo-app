name: Web client to GitHub Pages

# One-time setup in the repository settings:
#   Pages > Build and deployment > Source: GitHub Actions
#   Secrets and variables > Actions > Variables: TODO_API_URL = https://<your API>

on:
  push:
    branches: [main]
    paths:
      - web/**
      - shared/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Must match the `dioxus` version in Cargo.lock.
  DIOXUS_CLI_VERSION: 0.7.10

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Require the API address
        if: vars.TODO_API_URL == ''
        run: |
          echo "::error::Set the repository variable TODO_API_URL to the address of the JSON API."
          exit 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm "dioxus-cli@$DIOXUS_CLI_VERSION"

      - id: pages
        uses: actions/configure-pages@v5

      - name: Bundle
        env:
          TODO_API_URL: ${{ vars.TODO_API_URL }}
          # "/<repository>" for a project site, empty for a user site or a custom domain.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          args=(--package todo-web --platform web --release --out-dir dist)
          if [ -n "${BASE_PATH#/}" ]; then
            args+=(--base-path "${BASE_PATH#/}")
          fi
          dx bundle "${args[@]}"
          # Pages answers unknown paths with 404.html: let the app render them.
          cp dist/public/index.html dist/public/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
