[package]
name = "todo-api"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
chrono = { workspace = true, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["yaml", "env"] }
serde.workspace = true
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros", "uuid", "chrono"] }
thiserror = "2.0.21"
todo-shared = { workspace = true, features = ["openapi"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
turso = { version = "0.8.2", default-features = false }
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.3.0"
utoipa-swagger-ui = { version = "10.0.1", features = ["axum", "vendored"] }
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
# test-util: paused time, for the health check timeout test
tokio = { version = "1.53.2", features = ["test-util"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
figment = { version = "0.10.19", features = ["test"] }
