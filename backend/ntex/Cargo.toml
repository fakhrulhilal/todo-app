[package]
name = "todo-backend-ntex"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { workspace = true, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
# compio's own runtime crate, on the version ntex's compio backend uses. `polling` lets Linux fall back from io_uring
# to epoll where io_uring is blocked (Docker's default seccomp profile) instead of every worker panicking at start.
compio = { version = "0.19", default-features = false, features = ["runtime", "io-uring", "polling"] }
figment = { version = "0.10.19", features = ["yaml", "env"] }
# Every worker runs on compio. Nothing may enable `ntex/tokio`: tokio would win silently.
ntex = { version = "4.3.0", features = ["compio"] }
ntex-cors = "4.1.1"
serde.workspace = true
serde_json = "1.0.151"
# sqlx on the smol runtime instead of tokio: its sockets and timers run on async-io, whose reactor has a thread of
# its own, so sqlx's futures can be awaited right on the compio workers. No tokio anywhere.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-smol", "tls-rustls-ring-webpki", "postgres", "migrate", "macros", "uuid", "chrono"] }
thiserror = "2.0.21"
todo-contract = { workspace = true, features = ["openapi"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
turso = { version = "0.8.2", default-features = false }
utoipa = { version = "6.0.0", features = ["chrono", "uuid"] }
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
figment = { version = "0.10.19", features = ["test"] }
