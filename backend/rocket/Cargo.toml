[package]
name = "todo-backend-rocket"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { workspace = true, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["yaml", "env"] }
# The crate's own checks: postgres (no TLS, as the store's connections) and
# sqlite, with SQLite compiled in so the static image needs no system library.
health-checks = { version = "0.1.0", features = ["postgres", "sqlite-bundled"] }
# json: the Json guard and responder. uuid: Uuid as a path parameter.
rocket = { version = "0.5.2", features = ["json", "uuid"] }
serde.workspace = true
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros", "uuid", "chrono"] }
thiserror = "2.0.21"
todo-contract = { workspace = true, features = ["openapi"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
turso = { version = "0.8.2", default-features = false }
utoipa = { version = "6.0.0", features = ["chrono", "uuid"] }
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt", "test-util"] }
figment = { version = "0.10.19", features = ["test"] }
