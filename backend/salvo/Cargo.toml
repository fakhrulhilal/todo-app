[package]
name = "todo-backend-salvo"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { workspace = true, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["yaml", "env"] }
# No default features: they add cookies, the test client and aws-lc-rs, none of which this API uses.
salvo = { version = "1.0.1", default-features = false, features = ["server", "server-handle", "http1", "http2", "fix-http1-request-uri", "cors", "catch-panic", "affix-state"] }
serde.workspace = true
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros", "uuid", "chrono"] }
thiserror = "2.0.21"
todo-contract = { workspace = true, features = ["openapi"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
turso = { version = "0.8.2", default-features = false }
# The OpenAPI document comes from utoipa, as in the other backends, not salvo-oapi: the contract is utoipa's output.
utoipa = { version = "6.0.0", features = ["chrono", "uuid"] }
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
# test-util: paused time, for the health check timeout test
tokio = { version = "1.53.2", features = ["test-util"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
figment = { version = "0.10.19", features = ["test"] }
