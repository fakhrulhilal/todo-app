name: todo_list

services:
  frontend-dioxus:
    image: todo/frontend/dioxus:latest
    container_name: todo.dioxus
    build:
      context: .
      dockerfile: frontend/dioxus/Dockerfile
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    ports:
      - "${TODO_WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      backend-axum:
        condition: service_healthy
    restart: unless-stopped
    labels:
      dev.orbstack.domains: dx.todo.local,todo.local
      dev.orbstack.icon: https://dioxuslabs.com/assets/favicon-dxhabbedd29055fcd0.png

  frontend-leptos:
    image: todo/frontend/leptos:latest
    container_name: todo.leptos
    build:
      context: .
      dockerfile: frontend/leptos/Dockerfile
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    ports:
      - "${TODO_LEPTOS_PORT:-8083}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      backend-axum:
        condition: service_healthy
    restart: unless-stopped
    labels:
      dev.orbstack.domains: leptos.todo.local
      dev.orbstack.icon: https://raw.githubusercontent.com/leptos-rs/leptos/main/docs/logos/Leptos_logo_abbreviation__square_RGB.png

  backend-axum:
    image: todo/backend/axum:latest
    container_name: todo.axum
    build:
      context: .
      dockerfile: backend/axum/Dockerfile
    environment:
      DATABASE__URL: postgres://todo:${TODO_DB_PASSWORD:-todo}@db:5432/todo
      # db-init owns the schema here.
      DATABASE__MIGRATION: "false"
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    labels:
      dev.orbstack.http-port: 8080
      dev.orbstack.domains: axum.api.todo.local
      dev.orbstack.icon: https://raw.githubusercontent.com/tokio-rs/website/refs/heads/master/public/img/icons/tokio.svg

  backend-ntex:
    image: todo/backend/ntex:latest
    container_name: todo.ntex
    build:
      context: .
      dockerfile: backend/ntex/Dockerfile
    environment:
      DATABASE__URL: postgres://todo:${TODO_DB_PASSWORD:-todo}@db:5432/todo
      # db-init owns the schema here.
      DATABASE__MIGRATION: "false"
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    labels:
      dev.orbstack.http-port: 8080
      dev.orbstack.domains: ntex.api.todo.local,api.todo.local
      dev.orbstack.icon: https://avatars.githubusercontent.com/u/62459684
    networks:
      default:
        aliases:
          - api
          - backend

  fullstack-topcoat:
    image: todo/fullstack/topcoat:latest
    container_name: todo.topcoat
    build:
      context: .
      dockerfile: fullstack/topcoat/Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "${TODO_TOPCOAT_PORT:-8081}:8080"
    restart: unless-stopped
    labels:
      dev.orbstack.http-port: 8080
      dev.orbstack.domains: topcoat.todo.local
      dev.orbstack.icon: https://raw.githubusercontent.com/tokio-rs/topcoat/refs/heads/main/media/logo-light.svg
    environment:
      DATABASE__URL: postgres://todo:${TODO_DB_PASSWORD:-todo}@db:5432/todo
      # db-init owns the schema here.
      DATABASE__MIGRATION: "false"

  backend-docs:
    image: scalarapi/api-reference:0.6.15
    container_name: todo.scalar
    volumes:
      - ./contract/openapi.json:/docs/todo.json:ro
    environment:
      API_REFERENCE_CONFIG: >-
        {"servers": [
          {"url": "https://api.todo.local", "description": "Public API"},
          {"url": "https://ntex.api.todo.local", "description": "Public API on ntex"},
        ]}
    ports:
      - "${TODO_DOCS_PORT:-8084}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    labels:
      dev.orbstack.domains: docs.api.todo.local
      dev.orbstack.http-port: 8080
      dev.orbstack.icon: https://scalar.com/favicon.svg

  db:
    image: postgres:17-alpine
    container_name: todo.db
    labels:
      dev.orbstack.domains: db.todo.local
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: ${TODO_DB_PASSWORD:-todo}
      POSTGRES_DB: todo
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # pgschema compares a scratch copy of the desired schema with the real one.
  # Its built-in scratch server would be downloaded at run time, so it gets a
  # database of its own on this server instead. CREATE DATABASE cannot be in
  # db's init scripts: those run only on an empty volume.
  db-plan-init:
    image: postgres:17-alpine
    container_name: todo.db-plan-init
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: todo
      PGPASSWORD: ${TODO_DB_PASSWORD:-todo}
      PGDATABASE: todo
    command:
      - sh
      - -c
      - >-
        psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'pgschema_plan'" | grep -q 1
        || psql -c "CREATE DATABASE pgschema_plan"

  # Brings the database to db/postgres/schema.sql, the schema every
  # implementation shares, on every `up`. No change, no work. The apps run
  # with database.migration off, so this is the only thing that changes it.
  db-init:
    image: pgplex/pgschema:1.13.3
    container_name: todo.db-init
    restart: "no"
    depends_on:
      db-plan-init:
        condition: service_completed_successfully
    labels:
      dev.orbstack.icon: https://www.pgschema.com/mintlify-assets/_mintlify/favicons/pgschema/eVMn3Wop0HZadgSF/_generated/favicon/apple-touch-icon.png
    volumes:
      - ./db/postgres:/schema:ro
    # pgschema reads .pgschemaignore from the working directory.
    working_dir: /schema
    # The connection is given as flags: pgschema 1.13.3 rejects a missing --db
    # even when PGDATABASE is set. The passwords stay out of the command line.
    environment:
      PGPASSWORD: ${TODO_DB_PASSWORD:-todo}
      PGSCHEMA_PLAN_PASSWORD: ${TODO_DB_PASSWORD:-todo}
    command:
      - apply
      - --host=db
      - --db=todo
      - --user=todo
      - --plan-host=db
      - --plan-db=pgschema_plan
      - --plan-user=todo
      - --file=/schema/schema.sql
      - --auto-approve
      - --no-color

configs:
  caddyfile:
    content: |
      :80 {
      	encode zstd gzip

      	@api path /api/* /health/*
      	handle @api {
      		reverse_proxy api:8080
      	}

      	# The API reference (backend-docs) under /docs. It serves from its own
      	# root, so the prefix is stripped, and the two files its page loads by
      	# absolute path are passed on as they are.
      	redir /docs /docs/
      	handle_path /docs/* {
      		reverse_proxy backend-docs:8080
      	}
      	@docs path /configuration.json /openapi/*
      	handle @docs {
      		reverse_proxy backend-docs:8080
      	}

      	handle {
      		root * /srv
      		# Paths that are not files belong to the client's router.
      		try_files {path} /index.html
      		file_server
      	}
      }

volumes:
  db-data:
