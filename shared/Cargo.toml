[package]
name = "todo-shared"
version.workspace = true
edition.workspace = true

[features]
# Derives the OpenAPI schemas. Only the server needs them.
openapi = ["dep:utoipa"]

[dependencies]
chrono.workspace = true
serde.workspace = true
utoipa = { version = "6.0.0", features = ["chrono", "uuid"], optional = true }
uuid.workspace = true
